[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-detection-system"
version = "0.1.0"
description = "An end-to-end fraud detection and risk decisioning portfolio project."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "catboost>=1.2,<2",
    "fastapi>=0.115,<1",
    "joblib>=1.4,<2",
    "lightgbm>=4.5,<5",
    "matplotlib>=3.9,<4",
    "mlflow>=2.17,<4",
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.9,<3",
    "python-dotenv>=1.0,<2",
    "scikit-learn>=1.5,<2",
    "shap>=0.46,<1",
    "sqlalchemy>=2.0,<3",
    "streamlit>=1.39,<2",
    "uvicorn[standard]>=0.32,<1",
    "xgboost>=2.1,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.7,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

